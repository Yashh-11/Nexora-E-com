<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270"><style>text{font-family:Arial,sans-serif;fill:#102a43}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{fill:#fff;stroke:#17a2b8;stroke-width:3}.d{fill:#102a43}.w{fill:#fff}.a{stroke:#17a2b8;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#17a2b8"/></marker></defs><rect width="1000" height="270" fill="#eff9fa"/><g transform="translate(20 75)"><rect class="b" width="165" height="105" rx="14"/><text class="t" x="42" y="43">Signup</text><text class="s" x="21" y="70">name + email + pass</text></g><g transform="translate(215 75)"><rect class="b" width="165" height="105" rx="14"/><text class="t" x="42" y="43">Server</text><text class="s" x="19" y="70">hash + create user</text></g><g transform="translate(410 75)"><rect class="d" width="165" height="105" rx="14"/><text class="t w" x="59" y="43">OTP</text><text class="s w" x="24" y="70">email 6-digit code</text></g><g transform="translate(605 75)"><rect class="b" width="165" height="105" rx="14"/><text class="t" x="43" y="43">Verify</text><text class="s" x="24" y="70">10-minute expiry</text></g><g transform="translate(800 75)"><rect class="b" width="165" height="105" rx="14"/><text class="t" x="47" y="43">Login</text><text class="s" x="23" y="70">verified account</text></g><path class="a" d="M185 128H210M380 128H405M575 128H600M770 128H795"/></svg>
